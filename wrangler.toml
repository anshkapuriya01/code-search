# Internal Cloudflare names ("starscout") are not shown to users; renaming them would create a new Worker/database.
name = "starscout"
main = "src/index.js"
compatibility_date = "2026-10-01"

# Served only on the custom domain. Requires amplfyd.com to be an active zone in this Cloudflare account;
# `wrangler deploy` then creates the DNS record and HTTPS certificate automatically.
workers_dev = false
routes = [
  { pattern = "codesearch.amplfyd.com", custom_domain = true }
]

# Static files (HTML, CSS, JS) — served free, without running the Worker.
[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "404-page"
# Browsers mark link clicks as navigations, and Cloudflare sends navigations to the static files first.
# These paths are not files, so they must always reach the Worker (otherwise /auth/login shows the 404 page).
run_worker_first = ["/auth/*", "/api/*", "/v1/*", "/mcp", "/mcp/*"]

# Database for users, sessions and API keys.
# Replace database_id with the id printed by:  npx wrangler d1 create starscout
[[d1_databases]]
binding = "DB"
database_name = "starscout"
database_id = "cd1eef6a-f9bd-476d-ba51-6f533b6fa06b"
migrations_dir = "migrations"

# Per-account request limit (60/min) shared by REST, MCP and the dashboard. The admin account is exempt. If your
# plan does not support these bindings, delete both blocks: the Worker falls back to per-isolate in-memory limiters.
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "7311"
simple = { limit = 60, period = 60 }

# Per-IP limit (60/min) for calls with no valid sign-in or key.
[[ratelimits]]
name = "ANON_LIMITER"
namespace_id = "7312"
simple = { limit = 60, period = 60 }

# Daily clean-up: log, usage and session retention (src/maintenance.js).
[triggers]
crons = ["30 0 * * *"]

# Workers AI interprets search requests. The free allocation is 10,000 neurons a day; see AI_DAILY_NEURONS below.
[ai]
binding = "AI"

[vars]
# The one admin account, by numeric GitHub id. It has the admin console at /admin/ and no usage limits.
# Must be a single number: anything else means there is no admin.
ADMIN_GITHUB_ID = "185783357"
# Daily Workers AI limit in neurons, for the whole site. Above it, searches use the rule-based parser. 0 turns AI off.
AI_DAILY_NEURONS = "9000"
# Daily Workers AI limit in neurons for one account, so no account can use the site's whole budget.
AI_USER_DAILY_NEURONS = "500"
# Requests one account may make per UTC day.
USER_DAILY_REQUESTS = "1500"
# Requests all accounts together may make per UTC day. Keeps database writes free for sign-ins and key changes.
SITE_DAILY_REQUESTS = "15000"

[observability]
enabled = true

# Secrets (never put them in this file). Set each one with:  npx wrangler secret put <NAME>
#   GITHUB_CLIENT_ID      from your GitHub OAuth app
#   GITHUB_CLIENT_SECRET  from your GitHub OAuth app
#   TOKEN_ENCRYPTION_KEY  32 random bytes, base64:  openssl rand -base64 32
